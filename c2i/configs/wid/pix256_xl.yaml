# Native256 WiD NoGate. Training stages are selected with ordinary CLI overrides.
seed_everything: 0
per_run_seed: false
auto_resume: false
tags:
  exp: WiD-XL-256-initial
trainer:
  default_root_dir: ./output/wid
  accelerator: gpu
  strategy: ddp
  devices: 8
  num_nodes: 1
  precision: bf16-mixed
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  max_steps: 800000
  val_check_interval: 50000
  check_val_every_n_epoch: null
  num_sanity_val_steps: 0
  reload_dataloaders_every_n_epochs: 1
  log_every_n_steps: 50
  use_distributed_sampler: false
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: ./output/logs
      name: wid
  callbacks:
  - class_path: src.utils.CheckpointHook
    init_args:
      every_n_train_steps: 50000
      save_top_k: -1
      save_last: true
  - class_path: src.utils.SaveImagesHook
    init_args:
      save_dir: validation
      save_compressed: true
model:
  num_classes: 1000
  denoiser:
    class_path: pixdit_core.pixeldit_c2i.PixDiT
    init_args:
      in_channels: 3
      patch_size: 16
      num_groups: 16
      hidden_size: 1152
      patch_depth: 26
      pixel_depth: 4
      pixel_hidden_size: 16
      num_classes: 1000
      use_pixel_abs_pos: true
      pit_adaln_post_modulation: false
      spectral_head:
        class_path: pixdit_core.wipd.AnchoredSpectralHead
        init_args:
          prior_path: ../statistics/pca_uncentered.pt
          patch_size: 16
          channels: 3
          pixel_hidden_size: 16
          basis: pca
      pit_spectral_anchor:
        class_path: pixdit_core.wipd.PiTSpectralAnchor
        init_args:
          prior_path: ../statistics/pca_uncentered.pt
          patch_size: 16
          channels: 3
          pixel_hidden_size: 16
          basis: pca
  diffusion_trainer:
    class_path: src.diffusion.REPATrainer
    init_args:
      lognorm_t: true
      timeshift: 1.0
      feat_loss_weight: 0.5
      null_condition_p: 0.1
      encoder:
        class_path: src.diffusion.DINOv2
      align_layer: 8
      proj_denoiser_dim: 1152
      proj_hidden_dim: 1152
      proj_encoder_dim: 768
      scheduler: src.diffusion.LinearScheduler
  diffusion_sampler:
    class_path: src.diffusion.FlowDPMSolverSampler
    init_args:
      num_steps: 100
      guidance: 3.25
      timeshift: 1.0
      guidance_interval_min: 0.1
      guidance_interval_max: 1.0
      scheduler: src.diffusion.LinearScheduler
      w_scheduler: src.diffusion.LinearScheduler
      guidance_fn: src.diffusion.simple_guidance_fn
      step_fn: src.diffusion.ode_step_fn
  ema_tracker:
    class_path: src.utils.SimpleEMA
    init_args:
      decay: 0.9999
  optimizer:
    class_path: torch.optim.AdamW
    init_args:
      lr: 1.0e-4
      weight_decay: 0.0
  override_lr_on_resume: null
data:
  train_dataset:
    class_path: src.data.CustomINImageFolderDataset
    init_args:
      data_dir: /path/to/imagenet/train
      resolution: 256
  eval_dataset:
    class_path: src.data.ClassLabelRandomNDataset
    init_args:
      num_classes: 1000
      max_num_instances: 10000
      latent_shape: [3, 256, 256]
  pred_dataset:
    class_path: src.data.ClassLabelRandomNDataset
    init_args:
      num_classes: 1000
      max_num_instances: 50000
      latent_shape: [3, 256, 256]
  train_batch_size: 32
  train_num_workers: 4
  train_prefetch_factor: 4
  eval_batch_size: 32
  eval_num_workers: 2
  pred_batch_size: 32
  pred_num_workers: 1
  seed: 0
